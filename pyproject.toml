[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kannon"
version = "0.1.0"
description = "Model-informed market making bot for Kalshi prediction markets"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.scripts]
kannon = "kannon.main:main"
kannon-poly = "kannon.polymarket.main:main"
kannon-novig = "kannon.novig.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
