kalshi:
  environment: live
  base_url: https://api.kalshi.com/trade-api/v2
  ws_url: wss://api.kalshi.com/trade-api/ws/v2
  rate_limit_rps: 2

# ── Polymarket US ──────────────────────────────────────────────────────────────
# Credentials: generate at polymarket.us/developer (requires KYC via iOS app).
# Keys stored in .env as POLYMARKET_KEY_ID and POLYMARKET_SECRET_KEY.
polymarket:
  base_url: https://gateway.polymarket.us
  ws_url: wss://gateway.polymarket.us/v1/ws/markets
  rate_limit_rps: 1.0           # 60 req/min public limit → 1/s to stay safe

# ── Fees & Taxes ──────────────────────────────────────────────────────────────
# IMPORTANT: Kalshi charges ~7% of gross profit on winning contracts.
# Tax treatment: currently treated as ordinary income in the US — not capital gains.
# Set marginal_tax_rate to your effective federal + state rate (e.g. 0.35 for 35%).
# Verify with a tax professional; tax rules for prediction markets are evolving.
fees:
  # Kalshi maker fee = 0% on standard markets (resting limit orders are free).
  # Taker fee formula: round_up(0.07 × C × P × (1-P)), max ~$1.75/100 contracts.
  # As a market maker we place resting limit orders → we are always the maker.
  fee_rate: 0.0               # 0% maker fee (standard markets)
  marginal_tax_rate: 0.0      # Set your effective federal+state rate (e.g. 0.17)
  flat_fee_cents: 0.0         # Per-contract flat fee (0 on Kalshi)

# ── Market Screening ──────────────────────────────────────────────────────────
#
# DEMO vs LIVE TUNING GUIDE
# ──────────────────────────
# Demo environment lacks real market makers, so most markets have no existing
# bid/ask quotes. The following settings are tuned for demo:
#
#   allow_unquoted_markets: true   → accept markets with empty books (bot quotes
#                                    at 50¢ prior FV, confidence=0, target spread)
#   max_spread_cents: 50           → accept wide demo spreads (live: use 15-20)
#   min_spread_cents: 1            → demo books are often 1¢ apart (live: use 3-5)
#   min_price_cents: 3             → demo markets sometimes sit at extremes
#
# When going LIVE, set:
#   allow_unquoted_markets: false  (CRITICAL — never quote truly uncharted markets)
#   max_spread_cents: 20           (tighten to avoid wide adverse-selection markets)
#   min_spread_cents: 3
#   min_volume_24h: 100+
#   min_open_interest: 50+
#
screening:
  min_volume_24h: 50          # live: only quote markets with real trading activity
  min_open_interest: 25
  max_time_to_expiry_days: 30
  min_spread_cents: 3         # live: avoid sub-3¢ noise
  max_spread_cents: 20        # live: skip wide/illiquid markets
  max_markets_active: 10
  min_price_cents: 3          # skip near-settled (< 3¢ from 0 or 100)
  market_refresh_interval_seconds: 300
  # Demo only: accept markets with no existing bid/ask quotes.
  # The bot falls back to 50¢ fair value with confidence=0 (uses target_half_spread).
  # NEVER enable this on live — no quotes = no price signal = pure adverse selection.
  allow_unquoted_markets: false
  # In-play sports prop markets: informed traders watching live games instantly
  # pick off any stale quote. Never quote these as an uninformed market maker.
  excluded_ticker_prefixes:
    # These markets share a structural flaw: a subset of participants has real-time
    # observational data (live game state, live scores) that a resting limit order
    # cannot react to. The informed trader sees the outcome forming before the
    # market price moves, and takes the other side of any stale quote immediately.
    # An uninformed market maker with a ~10s requote cooldown cannot compete.
    - "KXMLB"      # MLB game/player props
    - "KXNBA"      # NBA game/player props
    - "KXNHL"      # NHL game/player props
    - "KXNFL"      # NFL game/player props
    - "KXNASCAR"   # NASCAR live props
    - "KXSOCCER"   # Soccer live props
    - "KXMLS"      # MLS soccer
    - "KXATP"      # ATP tennis live match
    - "KXWTA"      # WTA tennis live match
    - "KXUFC"      # UFC fights
    - "KXBOXING"   # Boxing
    - "KXCFL"      # CFL football
    - "KXNCAAB"    # College basketball
    - "KXNCAAF"    # College football
    # Opaque cross-category markets — cryptic tickers, unclear resolution criteria
    - "KXMVECROSS"
    # Multi-game extended markets — these only have ask=100¢ (already settled) and
    # reject orders with HTTP 410 deprecated_v1_order_endpoint. Always exclude.
    - "KXMVESPORTS"

# ── Fair Value Model ──────────────────────────────────────────────────────────
fair_value:
  # In thin demo books a single $1 order creates 100% imbalance.
  # 0.15 limits FV shift to ≤1.5¢ per $1 of one-sided depth; tune up for live markets.
  imbalance_weight: 0.15
  depth_levels: 5             # levels to include in imbalance calculation
  volatility_lookback: 20     # ticks for rolling |Δmid| estimate
  sigma_base: 1.0             # scales beta-process vol: σ_eff = σ_base·√(p(1-p))

# ── OFI (Order Flow Imbalance) ────────────────────────────────────────────────
ofi:
  beta: 0.002                 # cents per unit OFI — calibrate from live data
  ema_alpha: 0.10             # EMA smoothing (lower = slower, more stable)
  max_adjustment_cents: 5.0   # clamp OFI signal to ±this many cents

# ── VPIN (Adverse Selection Detection) ───────────────────────────────────────
# VPIN > 0.3 → caution (widen 1.5–2×); VPIN > 0.6 → toxic (pull all quotes)
vpin:
  bucket_size: 5.0            # V* contracts per volume bucket (demo has low volume)
  n_buckets: 20               # lookback window (number of buckets)

# ── Market Making (Avellaneda-Stoikov) ───────────────────────────────────────
#
# DEMO vs LIVE TUNING GUIDE
# ──────────────────────────
# On demo the bot quotes into empty books using a 50¢ prior (confidence=0),
# so A-S formula gives zero signal and we fall back to target_half_spread_cents.
# Wider spreads are correct here: we have no FV signal, so take more edge.
#
# When going LIVE, tighten these:
#   target_half_spread_cents: 3.0   (tighter = more fills, less edge per fill)
#   min_half_spread_cents: 2.0
#   risk_aversion: 0.1              (calibrate to your actual fill rate)
#   order_depth_k: 5.0              (lower = wider A-S spread in liquid books)
#   default_size_contracts: 3-5     (increase as you build confidence)
#
market_making:
  # Spread parameters
  # Demo: wide target spread since we're quoting blind (50¢ prior, no orderbook signal).
  # Live: tighten target_half_spread_cents to 3-4 once you have real FV signal.
  target_half_spread_cents: 4.0
  min_half_spread_cents: 2.0
  max_half_spread_cents: 25.0

  # Avellaneda-Stoikov parameters
  # Calibrated for binary contracts in [0,1] probability space.
  risk_aversion: 0.05         # γ: higher = wider spreads / stronger inventory skew
  order_depth_k: 5.0          # κ: order arrival decay rate in [0,1] price space (live: 5.0 per tuning guide)
  t_min: 0.05                 # floor on T to prevent spread collapse near expiry

  # Sizing
  default_size_contracts: 1
  max_position_contracts: 3   # live: sized for $10 balance (~$0.30-3 exposure/market at this cap)
  inventory_skew_factor: 0.15

  # Timing
  stale_quote_ttl_seconds: 3600  # 1 hour — prediction market orders should rest for hours
  # Live: tightened from 30s — shortens the window where the bot's own unfilled
  # position/risk state can drift stale relative to real fills on the exchange.
  position_sync_interval_seconds: 10

  # Order manager tuning (configurable, defaults used if omitted)
  price_move_threshold_cents: 3   # live books move more than demo; avoid excessive cancel/replace churn
  quote_cooldown_seconds: 3       # live: requote a bit faster to stay competitive

  # Pin-risk extra spread near 0 or 100 cents.
  # Adds k_pin / sqrt(min(p, 1-p)) half-cents of extra spread.
  # At 5¢ (p=0.05): adds ~4.5×k_pin.  Set to 0 to disable.
  pin_risk_coeff: 0.0

# ── Risk Management ───────────────────────────────────────────────────────────
# max_daily_loss_dollars: halt if mark-to-market equity drops more than this
# from session start. Set to ~10-15% of account balance.
# With $10 live balance → $1 limit = 10% drawdown before halt.
risk:
  max_daily_loss_dollars: 1.0
  max_single_market_contracts: 3
  max_total_delta_contracts: 8    # live: sized so worst-case exposure (~8 contracts × ~$1) fits $10 balance
  halt_on_daily_loss: true

# ── Arb Scanner ───────────────────────────────────────────────────────────────
arb:
  min_net_profit_cents: 1.5   # minimum after-fee profit to flag an opportunity

# ── External Signals ──────────────────────────────────────────────────────────
# Provides live data anchors for financial-outcome and FOMC contracts.
# All sources are free and require no API key.
#
# Binance WebSocket: streams real-time BTC/ETH spot prices.
#   Used for KXBTC-* and KXETH-* contracts via binary Black-Scholes.
#   anchor_weight 0.55 = blend 55% Binance BS + 45% orderbook microstructure.
#   Set to false to disable if running air-gapped / without internet.
#
# FedWatch: polls CME FedWatch for FOMC rate probabilities every 10 minutes.
#   Used for FOMC-* and KXFED-* contracts.
#   anchor_weight 0.70 = high confidence (FedWatch is the market consensus).
signals:
  enabled: true
  binance:
    enabled: true       # streams BTC/ETH via wss://stream.binance.com
  fedwatch:
    enabled: true
    poll_interval_seconds: 600   # CME FedWatch — 10-minute poll is plenty

# ── Analytics (Fill Tracker) ──────────────────────────────────────────────────
# Logs every order placed to a SQLite database for post-session P&L analysis.
# Tracks: ticker, side, price, size, fair_value at placement, EV, order_id.
# Also logs mark-to-market equity snapshots every position_sync_interval_seconds.
#
# To inspect after a session:
#   sqlite3 logs/fills.db "SELECT * FROM orders ORDER BY ts DESC LIMIT 20;"
#   sqlite3 logs/fills.db "SELECT * FROM equity_snapshots ORDER BY ts DESC LIMIT 10;"
analytics:
  enabled: true
  db_path: logs/fills.db

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: INFO
  file: logs/kannon.log
